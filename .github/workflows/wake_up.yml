name: Wake Up Streamlit (Every 12 Hours)

on:
  schedule:
    # 12시간마다 자동 실행 (한국 시간 기준 매일 오전 09시, 오후 21시)
    # UTC 00:00 = KST 09:00 / UTC 12:00 = KST 21:00
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 수동 테스트 실행 버튼 활성화

jobs:
  wake_up_job:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 가상 브라우저(Playwright) 엔진 설치
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 대시보드 자동 방문 및 깨우기 실행
        run: |
          python wake_up.py
